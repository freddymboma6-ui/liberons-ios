name: Remove redundant external Help Center entry

on:
  push:
    paths:
      - '.github/workflows/remove-redundant-help-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Remove duplicate Help Center row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Liberons/AccountSettingsViews.swift')
          s = p.read_text()
          old = '''                LiberonsExternalRow(icon: "questionmark.circle.fill", title: language.text("Help Center", "Centre d’aide"), subtitle: language.text("More support resources", "Plus de ressources d’assistance")) { open(.support) }\n'''
          if old not in s:
              raise SystemExit('Expected Help Center row not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/AccountSettingsViews.swift
          git commit -m "Remove redundant external Help Center entry"
          git push origin HEAD:library-protected-media
