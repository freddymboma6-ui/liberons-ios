name: Sharpen protected library thumbnails

on:
  push:
    branches: [library-protected-media]
    paths:
      - '.github/workflows/sharpen-protected-library-thumbnails.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Patch thumbnail quality
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()
          start = s.index('private struct ProtectedLibraryTile:View')
          tile = s[start:]
          original = tile

          # Retina-quality local thumbnails.
          tile, size_count = re.subn(
              r'targetSize\s*:\s*CGSize\(width\s*:\s*500\s*,\s*height\s*:\s*500\)',
              'targetSize:CGSize(width:1200,height:1200)',
              tile,
              count=1,
          )
          if size_count == 0 and 'CGSize(width:1200,height:1200)' not in tile:
              raise SystemExit('ProtectedLibraryTile 500x500 request not found')

          needle = 'let options=PHImageRequestOptions();options.isNetworkAccessAllowed=true;'
          if needle in tile and 'options.deliveryMode = .highQualityFormat;options.resizeMode = .exact;' not in tile:
              tile = tile.replace(
                  needle,
                  needle + 'options.deliveryMode = .highQualityFormat;options.resizeMode = .exact;',
                  1,
              )

          # Cloud-only photos: use the protected original for the grid. Videos keep preview artwork.
          if 'if !isVideo,let original=try? await SupabaseService.cloudOriginalURL(assetID:item.id)' not in tile:
              preview_start = tile.find('if let preview=try? await SupabaseService.cloudPreviewURL(assetID:item.id)')
              if preview_start < 0:
                  raise SystemExit('ProtectedLibraryTile cloud preview start not found')
              preview_end = tile.find('}', preview_start)
              if preview_end < 0:
                  raise SystemExit('ProtectedLibraryTile cloud preview end not found')
              preview_block = tile[preview_start:preview_end + 1]
              original_block = ('if !isVideo,let original=try? await SupabaseService.cloudOriginalURL(assetID:item.id),'
                  'let(data,response)=try? await URLSession.shared.data(from:original),'
                  '(response as? HTTPURLResponse)?.statusCode ?? 500 < 300,'
                  'let decoded=UIImage(data:data){ProtectedMediaCache.shared.storeThumbnail(decoded,for:item.id);image=decoded;return};')
              tile = tile[:preview_start] + original_block + preview_block + tile[preview_end + 1:]

          if tile == original:
              print('Thumbnail quality patch already present')
          s = s[:start] + tile
          p.write_text(s)

      - name: Verify patch
        run: |
          grep -q 'CGSize(width:1200,height:1200)' Liberons/ProtectedLibraryView.swift
          grep -q 'options.deliveryMode = .highQualityFormat' Liberons/ProtectedLibraryView.swift
          grep -q 'if !isVideo,let original=try? await SupabaseService.cloudOriginalURL' Liberons/ProtectedLibraryView.swift
          git diff --check

      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Sharpen protected library thumbnails'
          git push origin HEAD:library-protected-media
