name: Fix dashboard real coverage

on:
  push:
    branches: [library-protected-media]
    paths:
      - '.github/workflows/fix-dashboard-real-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Localize dashboard protection status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Liberons/ContentView.swift')
          s = p.read_text()
          old = 'language.text("Libérons protection active","Protection Libérons active")'
          new = 'language.text("Libérons protection is active","Protection Libérons active")'
          if old not in s:
              raise SystemExit('Expected dashboard protection label not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Liberons/ContentView.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Fix English dashboard protection status'
          git push origin HEAD:library-protected-media
