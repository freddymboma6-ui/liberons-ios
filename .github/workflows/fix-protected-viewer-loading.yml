name: Fix protected viewer loading
on:
  push:
    paths:
      - '.github/protected-viewer-fix-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Patch viewer loading
        shell: python
        run: |
          from pathlib import Path
          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()
          old = '''private struct ProtectedZoomablePhoto:UIViewRepresentable{let image:UIImage;func makeCoordinator()->Coordinator{Coordinator()};func makeUIView(context:Context)->UIScrollView{let scrollView=UIScrollView();scrollView.delegate=context.coordinator;scrollView.minimumZoomScale=1;scrollView.maximumZoomScale=5;scrollView.bouncesZoom=true;scrollView.showsVerticalScrollIndicator=false;scrollView.showsHorizontalScrollIndicator=false;scrollView.contentInsetAdjustmentBehavior = .never;scrollView.decelerationRate = .fast;scrollView.backgroundColor = .black;let imageView=context.coordinator.imageView;imageView.image=image;imageView.contentMode = .scaleAspectFit;imageView.isUserInteractionEnabled=true;scrollView.addSubview(imageView);let doubleTap=UITapGestureRecognizer(target:context.coordinator,action:#selector(Coordinator.handleDoubleTap(_:)));doubleTap.numberOfTapsRequired=2;scrollView.addGestureRecognizer(doubleTap);context.coordinator.scrollView=scrollView;return scrollView};func updateUIView(_ scrollView:UIScrollView,context:Context){context.coordinator.imageView.image=image;context.coordinator.layoutImage(in:scrollView)};@MainActor final class Coordinator:NSObject,UIScrollViewDelegate{let imageView=UIImageView();weak var scrollView:UIScrollView?;func viewForZooming(in scrollView:UIScrollView)->UIView?{imageView};func scrollViewDidZoom(_ scrollView:UIScrollView){centerImage(in:scrollView)};func scrollViewDidEndZooming(_ scrollView:UIScrollView,with view:UIView?,atScale scale:CGFloat){centerImage(in:scrollView)};func layoutImage(in scrollView:UIScrollView){guard scrollView.bounds.width>0,scrollView.bounds.height>0 else{return};let size=scrollView.bounds.size;if imageView.bounds.size != size{imageView.frame=CGRect(origin:.zero,size:size);scrollView.contentSize=size};centerImage(in:scrollView)};private func centerImage(in scrollView:UIScrollView){let scaledWidth=imageView.bounds.width*scrollView.zoomScale;let scaledHeight=imageView.bounds.height*scrollView.zoomScale;let horizontal=max(0,(scrollView.bounds.width-scaledWidth)/2);let vertical=max(0,(scrollView.bounds.height-scaledHeight)/2);scrollView.contentInset=UIEdgeInsets(top:vertical,left:horizontal,bottom:vertical,right:horizontal)};@objc func handleDoubleTap(_ gesture:UITapGestureRecognizer){guard let scrollView else{return};if scrollView.zoomScale>scrollView.minimumZoomScale+0.01{scrollView.setZoomScale(scrollView.minimumZoomScale,animated:true);return};let targetScale=min(CGFloat(2.5),scrollView.maximumZoomScale);let point=gesture.location(in:imageView);let width=scrollView.bounds.width/targetScale;let height=scrollView.bounds.height/targetScale;scrollView.zoom(to:CGRect(x:point.x-width/2,y:point.y-height/2,width:width,height:height),animated:true)}}}'''
          new = '''private struct ProtectedZoomablePhoto:UIViewRepresentable{let image:UIImage;func makeCoordinator()->Coordinator{Coordinator()};func makeUIView(context:Context)->ProtectedPhotoScrollView{let scrollView=ProtectedPhotoScrollView();scrollView.zoomDelegate=context.coordinator;scrollView.minimumZoomScale=1;scrollView.maximumZoomScale=5;scrollView.bouncesZoom=true;scrollView.showsVerticalScrollIndicator=false;scrollView.showsHorizontalScrollIndicator=false;scrollView.contentInsetAdjustmentBehavior = .never;scrollView.decelerationRate = .fast;scrollView.backgroundColor = .black;let imageView=context.coordinator.imageView;imageView.image=image;imageView.contentMode = .scaleAspectFit;imageView.isUserInteractionEnabled=true;scrollView.addSubview(imageView);let doubleTap=UITapGestureRecognizer(target:context.coordinator,action:#selector(Coordinator.handleDoubleTap(_:)));doubleTap.numberOfTapsRequired=2;scrollView.addGestureRecognizer(doubleTap);context.coordinator.scrollView=scrollView;scrollView.onLayout={ [weak coordinator=context.coordinator, weak scrollView] in guard let coordinator,let scrollView else{return};coordinator.layoutImage(in:scrollView)};return scrollView};func updateUIView(_ scrollView:ProtectedPhotoScrollView,context:Context){context.coordinator.imageView.image=image;context.coordinator.layoutImage(in:scrollView)};@MainActor final class Coordinator:NSObject,UIScrollViewDelegate{let imageView=UIImageView();weak var scrollView:UIScrollView?;func viewForZooming(in scrollView:UIScrollView)->UIView?{imageView};func scrollViewDidZoom(_ scrollView:UIScrollView){centerImage(in:scrollView)};func scrollViewDidEndZooming(_ scrollView:UIScrollView,with view:UIView?,atScale scale:CGFloat){centerImage(in:scrollView)};func layoutImage(in scrollView:UIScrollView){guard scrollView.bounds.width>0,scrollView.bounds.height>0 else{return};let size=scrollView.bounds.size;if imageView.frame.size != size{imageView.frame=CGRect(origin:.zero,size:size);scrollView.contentSize=size};centerImage(in:scrollView)};private func centerImage(in scrollView:UIScrollView){let scaledWidth=imageView.bounds.width*scrollView.zoomScale;let scaledHeight=imageView.bounds.height*scrollView.zoomScale;let horizontal=max(0,(scrollView.bounds.width-scaledWidth)/2);let vertical=max(0,(scrollView.bounds.height-scaledHeight)/2);scrollView.contentInset=UIEdgeInsets(top:vertical,left:horizontal,bottom:vertical,right:horizontal)};@objc func handleDoubleTap(_ gesture:UITapGestureRecognizer){guard let scrollView else{return};if scrollView.zoomScale>scrollView.minimumZoomScale+0.01{scrollView.setZoomScale(scrollView.minimumZoomScale,animated:true);return};let targetScale=min(CGFloat(2.5),scrollView.maximumZoomScale);let point=gesture.location(in:imageView);let width=scrollView.bounds.width/targetScale;let height=scrollView.bounds.height/targetScale;scrollView.zoom(to:CGRect(x:point.x-width/2,y:point.y-height/2,width:width,height:height),animated:true)}}}
private final class ProtectedPhotoScrollView:UIScrollView{var onLayout:(()->Void)?;weak var zoomDelegate:UIScrollViewDelegate?{didSet{delegate=zoomDelegate}};override func layoutSubviews(){super.layoutSubviews();onLayout?()}}'''
          if old not in s:
              raise SystemExit('ProtectedZoomablePhoto block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/ProtectedLibraryView.swift
          git commit -m "Fix protected photo viewer layout" || exit 0
          git push origin HEAD:library-protected-media
