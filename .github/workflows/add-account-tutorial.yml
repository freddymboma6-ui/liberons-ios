name: Add iOS account tutorial shortcut

on:
  push:
    branches:
      - library-protected-media

permissions:
  contents: write

jobs:
  update-account-tutorial:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Add tutorial shortcut to Account
        shell: python
        run: |
          from pathlib import Path
          path = Path('Liberons/ContentView.swift')
          text = path.read_text()
          old = 'VStack(spacing:0){NavigationLink{LiberonsHelpSupportView(language:language)}label:{SettingRow(icon:"questionmark.circle.fill",title:language.text("Help & support","Aide et support"))}.buttonStyle(.plain);Divider();NavigationLink{LiberonsAboutView(language:language)}label:{SettingRow(icon:"info.circle.fill",title:language.text("About Libérons","À propos de Libérons"))}.buttonStyle(.plain)}.card()'
          new = 'VStack(spacing:0){NavigationLink{LiberonsTutorialView(language:language)}label:{SettingRow(icon:"play.rectangle.fill",title:language.text("How to use Libérons","Comment utiliser Libérons"))}.buttonStyle(.plain);Divider();NavigationLink{LiberonsHelpSupportView(language:language)}label:{SettingRow(icon:"questionmark.circle.fill",title:language.text("Help & support","Aide et support"))}.buttonStyle(.plain);Divider();NavigationLink{LiberonsAboutView(language:language)}label:{SettingRow(icon:"info.circle.fill",title:language.text("About Libérons","À propos de Libérons"))}.buttonStyle(.plain)}.card()'
          if new in text:
              print('Tutorial shortcut already present')
          elif old not in text:
              raise SystemExit('Expected Account support card not found; refusing unsafe edit')
          else:
              path.write_text(text.replace(old, new, 1))
      - name: Commit account shortcut and remove temporary workflow
        run: |
          rm -f .github/workflows/add-account-tutorial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/ContentView.swift .github/workflows/add-account-tutorial.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add official tutorial shortcut to iOS account"
          git push origin HEAD:library-protected-media
