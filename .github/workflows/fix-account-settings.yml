name: Apply account settings fixes
on:
  push:
    branches: [library-protected-media]
    paths: [.github/workflows/fix-account-settings.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Fix Swift sources
        shell: python
        run: |
          from pathlib import Path

          faq = Path('Liberons/AccountSettingsViews.swift')
          s = faq.read_text()
          bad = 'private var groupedCategories: [String] { categories.map(\\.0).filter { $0 != "all" && filteredItems.contains(where: { $0.category == $0 }) } }'
          good = 'private var groupedCategories: [String] { categories.map(\\.0).filter { categoryID in categoryID != "all" && filteredItems.contains(where: { item in item.category == categoryID }) } }'
          if bad not in s:
              raise SystemExit('Expected FAQ closure was not found')
          faq.write_text(s.replace(bad, good, 1))

          content = Path('Liberons/ContentView.swift')
          s = content.read_text()
          old = 'private struct SettingRow:View{let icon:String;let title:String;var trailing:String?=nil;var body:some View{HStack(spacing:13){Image(systemName:icon).frame(width:25).foregroundStyle(.blue);Text(title);Spacer();if let trailing{Text(trailing).foregroundStyle(.secondary)};Image(systemName:"chevron.right").font(.caption.bold()).foregroundStyle(.tertiary)}.padding(.vertical,15)}}'
          new = 'private struct SettingRow:View{let icon:String;let title:String;var trailing:String?=nil;var body:some View{HStack(spacing:13){Image(systemName:icon).frame(width:25).foregroundStyle(.blue);Text(title);Spacer();if let trailing{Text(trailing).foregroundStyle(.secondary)};Image(systemName:"chevron.right").font(.caption.bold()).foregroundStyle(.tertiary)}.frame(maxWidth:.infinity,alignment:.leading).padding(.vertical,15).contentShape(Rectangle())}}'
          if old not in s:
              raise SystemExit('Expected SettingRow was not found')
          content.write_text(s.replace(old, new, 1))

          Path('.github/workflows/fix-account-settings.yml').unlink()
      - name: Commit fixes
        run: |
          git config user.name "freddymboma6-ui"
          git config user.email "freddymboma6@gmail.com"
          git add Liberons/AccountSettingsViews.swift Liberons/ContentView.swift .github/workflows/fix-account-settings.yml
          git commit -m "Fix FAQ build and full-width account setting taps"
          git push origin HEAD:library-protected-media
