name: Premium protected library v1.1

on:
  push:
    branches: [library-premium-v11]
    paths:
      - '.github/workflows/premium-library-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-premium-v11
      - name: Upgrade protected library UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()

          old_state = '''    @State private var deletingSelection = false
    @Namespace private var photoTransition
    private let columns = Array(repeating: GridItem(.flexible(), spacing: 2), count: 3)
'''
          new_state = '''    @State private var deletingSelection = false
    @State private var mediaFilter: ProtectedLibraryFilter = .all
    @State private var sortNewestFirst = true
    @Namespace private var photoTransition
    private let columns = Array(repeating: GridItem(.flexible(), spacing: 2), count: 3)

    private var filteredItems: [ProtectedCloudMedia] {
        let filtered = store.items.filter { item in
            switch mediaFilter {
            case .all: return true
            case .photos: return !isVideo(item) && !isScreenshot(item)
            case .videos: return isVideo(item)
            case .screenshots: return isScreenshot(item)
            }
        }
        return filtered.sorted {
            let lhs = $0.capturedAt ?? $0.createdAt ?? .distantPast
            let rhs = $1.capturedAt ?? $1.createdAt ?? .distantPast
            return sortNewestFirst ? lhs > rhs : lhs < rhs
        }
    }

    private func isVideo(_ item: ProtectedCloudMedia) -> Bool {
        item.mediaType.lowercased().contains("video")
    }

    private func isScreenshot(_ item: ProtectedCloudMedia) -> Bool {
        guard !isVideo(item) else { return false }
        if let localID = item.iosLocalIdentifier,
           let asset = PHAsset.fetchAssets(withLocalIdentifiers: [localID], options: nil).firstObject {
            return asset.mediaSubtypes.contains(.photoScreenshot)
        }
        let name = (item.originalFilename ?? "").lowercased()
        return name.contains("screenshot") || name.contains("capture d’écran") || name.contains("capture d'ecran") || name.contains("capture_decran")
    }

    private func count(for filter: ProtectedLibraryFilter) -> Int {
        switch filter {
        case .all: return store.items.count
        case .photos: return store.items.filter { !isVideo($0) && !isScreenshot($0) }.count
        case .videos: return store.items.filter(isVideo).count
        case .screenshots: return store.items.filter(isScreenshot).count
        }
    }
'''
          assert old_state in s, 'state anchor changed; refusing unsafe patch'
          s = s.replace(old_state, new_state, 1)

          old_grid = '''                            HStack { Label(language.text("Protected", "Protégés"), systemImage: "checkmark.shield.fill").foregroundStyle(.green); Spacer(); Text(isSelecting ? "\\(selectedIDs.count) \\(language.text("selected", "sélectionné(s)"))" : "\\(store.items.count) \\(language.text("items", "éléments"))") }.font(.subheadline.bold()).foregroundStyle(.secondary).padding(.horizontal, 16)
                            LazyVGrid(columns: columns, spacing: 2) {
                                ForEach(store.items) { item in
                                    ProtectedLibraryTile(item: item).matchedTransitionSource(id: item.id, in: photoTransition)
                                        .overlay(alignment: .topTrailing) { if isSelecting { Image(systemName: selectedIDs.contains(item.id) ? "checkmark.circle.fill" : "circle").font(.title2).foregroundStyle(.white).padding(7) } }
                                        .contentShape(Rectangle()).onTapGesture { isSelecting ? toggle(item.id) : (viewerItem = item) }.onLongPressGesture(minimumDuration: 0.35) { if !isSelecting { isSelecting = true; selectedIDs = [item.id] } }
                                }
                            }
'''
          new_grid = '''                            VStack(spacing: 12) {
                                ScrollView(.horizontal, showsIndicators: false) {
                                    HStack(spacing: 8) {
                                        ForEach(ProtectedLibraryFilter.allCases) { filter in
                                            Button {
                                                withAnimation(.snappy(duration: 0.22)) { mediaFilter = filter }
                                                if isSelecting { selectedIDs = selectedIDs.intersection(Set(filteredItems.map(\\.id))) }
                                            } label: {
                                                HStack(spacing: 7) {
                                                    Image(systemName: filter.icon)
                                                        .font(.caption.weight(.semibold))
                                                    Text(filter.title(language))
                                                        .font(.subheadline.weight(.semibold))
                                                    Text("\\(count(for: filter))")
                                                        .font(.caption2.weight(.bold))
                                                        .foregroundStyle(mediaFilter == filter ? Color.primary.opacity(0.72) : Color.secondary)
                                                        .padding(.horizontal, 6).padding(.vertical, 3)
                                                        .background(.primary.opacity(mediaFilter == filter ? 0.08 : 0.05), in: Capsule())
                                                }
                                                .foregroundStyle(mediaFilter == filter ? Color.primary : Color.secondary)
                                                .padding(.horizontal, 13).padding(.vertical, 9)
                                                .background(mediaFilter == filter ? Color.primary.opacity(0.09) : Color.secondary.opacity(0.07), in: Capsule())
                                            }
                                            .buttonStyle(.plain)
                                        }
                                    }
                                    .padding(.horizontal, 16)
                                }

                                HStack(spacing: 10) {
                                    Label(language.text("Protected", "Protégés"), systemImage: "checkmark.shield.fill")
                                        .foregroundStyle(.green)
                                    Spacer()
                                    Text(isSelecting ? "\\(selectedIDs.count) \\(language.text("selected", "sélectionné(s)"))" : "\\(filteredItems.count) \\(language.text("items", "éléments"))")
                                        .foregroundStyle(.secondary)
                                    Menu {
                                        Button { sortNewestFirst = true } label: {
                                            Label(language.text("Newest first", "Plus récents"), systemImage: sortNewestFirst ? "checkmark" : "arrow.down")
                                        }
                                        Button { sortNewestFirst = false } label: {
                                            Label(language.text("Oldest first", "Plus anciens"), systemImage: !sortNewestFirst ? "checkmark" : "arrow.up")
                                        }
                                    } label: {
                                        Image(systemName: "arrow.up.arrow.down")
                                            .font(.subheadline.weight(.semibold))
                                            .frame(width: 32, height: 32)
                                            .background(.secondary.opacity(0.09), in: Circle())
                                    }
                                }
                                .font(.subheadline.bold())
                                .padding(.horizontal, 16)
                            }

                            if filteredItems.isEmpty {
                                ContentUnavailableView(
                                    language.text("Nothing here yet", "Rien ici pour le moment"),
                                    systemImage: mediaFilter.icon,
                                    description: Text(language.text("Protected media in this category will appear here.", "Les médias protégés de cette catégorie apparaîtront ici."))
                                )
                                .frame(maxWidth: .infinity)
                                .padding(.vertical, 42)
                            } else {
                                LazyVGrid(columns: columns, spacing: 2) {
                                    ForEach(filteredItems) { item in
                                        ProtectedLibraryTile(item: item).matchedTransitionSource(id: item.id, in: photoTransition)
                                            .overlay(alignment: .topTrailing) {
                                                if isSelecting {
                                                    Image(systemName: selectedIDs.contains(item.id) ? "checkmark.circle.fill" : "circle")
                                                        .font(.title2).foregroundStyle(.white).shadow(radius: 3).padding(7)
                                                }
                                            }
                                            .contentShape(Rectangle())
                                            .onTapGesture { isSelecting ? toggle(item.id) : (viewerItem = item) }
                                            .onLongPressGesture(minimumDuration: 0.35) { if !isSelecting { isSelecting = true; selectedIDs = [item.id] } }
                                    }
                                }
                            }
'''
          assert old_grid in s, 'grid anchor changed; refusing unsafe patch'
          s = s.replace(old_grid, new_grid, 1)

          old_select = '''                            if selectedIDs.count == store.items.count {
                                selectedIDs.removeAll()
                            } else {
                                selectedIDs = Set(store.items.map(\\.id))
                            }
'''
          new_select = '''                            if !filteredItems.isEmpty && selectedIDs.count == filteredItems.count {
                                selectedIDs.removeAll()
                            } else {
                                selectedIDs = Set(filteredItems.map(\\.id))
                            }
'''
          assert old_select in s, 'select-all anchor changed; refusing unsafe patch'
          s = s.replace(old_select, new_select, 1)
          s = s.replace('Text(selectedIDs.count == store.items.count\n', 'Text(!filteredItems.isEmpty && selectedIDs.count == filteredItems.count\n', 1)

          old_cover = '''            .fullScreenCover(item: $viewerItem) { item in ProtectedGalleryViewer(items: store.items, initialID: item.id, language: language, billing: billing).onDisappear { Task { await store.refresh() } } }
'''
          new_cover = '''            .fullScreenCover(item: $viewerItem) { item in ProtectedGalleryViewer(items: filteredItems, initialID: item.id, language: language, billing: billing).onDisappear { Task { await store.refresh() } } }
'''
          assert old_cover in s, 'viewer anchor changed; refusing unsafe patch'
          s = s.replace(old_cover, new_cover, 1)

          enum_code = '''
private enum ProtectedLibraryFilter: String, CaseIterable, Identifiable {
    case all, photos, videos, screenshots
    var id: String { rawValue }
    var icon: String {
        switch self {
        case .all: return "square.grid.2x2.fill"
        case .photos: return "photo.fill"
        case .videos: return "play.rectangle.fill"
        case .screenshots: return "iphone.gen3"
        }
    }
    func title(_ language: LanguageStore) -> String {
        switch self {
        case .all: return language.text("All", "Tout")
        case .photos: return language.text("Photos", "Photos")
        case .videos: return language.text("Videos", "Vidéos")
        case .screenshots: return language.text("Screenshots", "Captures")
        }
    }
}

'''
          anchor = 'struct ProtectedLibraryView: View {'
          assert anchor in s, 'view anchor missing'
          s = s.replace(anchor, enum_code + anchor, 1)

          old_tile = '''private struct ProtectedLibraryTile:View{let item:ProtectedCloudMedia;@State private var image:UIImage?;private var isVideo:Bool{item.mediaType.lowercased().contains("video")};var body:some View{ZStack(alignment:.bottomTrailing){GeometryReader{proxy in ZStack{Rectangle().fill(Color.secondary.opacity(0.10));if let image{Image(uiImage:image).resizable().scaledToFill().frame(width:proxy.size.width,height:proxy.size.height).clipped()}else{Image(systemName:isVideo ? "video.fill":"photo.fill").foregroundStyle(.secondary)}}}.aspectRatio(1,contentMode:.fit);Image(systemName:"checkmark.shield.fill").font(.caption).foregroundStyle(.white).padding(6).background(.green,in:Circle()).padding(7)}.task(id:item.id){await loadThumbnail()}};'''
          new_tile = '''private struct ProtectedLibraryTile:View{let item:ProtectedCloudMedia;@State private var image:UIImage?;private var isVideo:Bool{item.mediaType.lowercased().contains("video")};private var isScreenshot:Bool{guard !isVideo else{return false};if let id=item.iosLocalIdentifier,let asset=PHAsset.fetchAssets(withLocalIdentifiers:[id],options:nil).firstObject{return asset.mediaSubtypes.contains(.photoScreenshot)};let name=(item.originalFilename ?? "").lowercased();return name.contains("screenshot") || name.contains("capture d’écran") || name.contains("capture d'ecran")};var body:some View{ZStack{GeometryReader{proxy in ZStack{Rectangle().fill(Color.secondary.opacity(0.10));if let image{Image(uiImage:image).resizable().scaledToFill().frame(width:proxy.size.width,height:proxy.size.height).clipped()}else{Image(systemName:isVideo ? "video.fill":"photo.fill").font(.title3).foregroundStyle(.secondary)};LinearGradient(colors:[.clear,.black.opacity(0.38)],startPoint:.center,endPoint:.bottom).allowsHitTesting(false)}}.aspectRatio(1,contentMode:.fit);VStack{HStack{Spacer();Image(systemName:"checkmark.shield.fill").font(.system(size:9,weight:.bold)).foregroundStyle(.white).frame(width:20,height:20).background(.green,in:Circle()).shadow(radius:2).padding(6)};Spacer();HStack(spacing:5){if isVideo{Image(systemName:"play.fill");Text("VIDEO")}else if isScreenshot{Image(systemName:"iphone.gen3");Text("CAPTURE")};Spacer()}.font(.system(size:9,weight:.bold)).foregroundStyle(.white).shadow(radius:2).padding(7)}}.task(id:item.id){await loadThumbnail()}};'''
          assert old_tile in s, 'tile anchor changed; refusing unsafe patch'
          s = s.replace(old_tile, new_tile, 1)

          p.write_text(s)
          PY
      - name: Commit premium library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/ProtectedLibraryView.swift
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade protected library with premium media filters"
            git push origin library-premium-v11
          fi
