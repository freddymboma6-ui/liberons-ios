name: Fix protected-space analysis
on:
  push:
    paths:
      - '.github/workflows/fix-protected-space-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Optimize reconciliation
        shell: python
        run: |
          from pathlib import Path
          p=Path('Liberons/ProtectedSpaceCleaner.swift')
          s=p.read_text()
          start=s.index('    private func localAsset(for row: ProtectedRow) -> PHAsset? {')
          end=s.index('\n    private func protectedRows()', start)
          new='''    private func resolveLocalAssets(for rows: [ProtectedRow]) async -> [(row: ProtectedRow, asset: PHAsset)] {
        // Resolve persistent PhotoKit identifiers in bulk. The previous implementation
        // performed one Photos query per cloud row (and sometimes a second library
        // search), which can block the MainActor for thousands of protected items.
        let identifiers = Array(Set(rows.compactMap { $0.iosLocalIdentifier }.filter { !$0.isEmpty }))
        var assetsByIdentifier: [String: PHAsset] = [:]
        if !identifiers.isEmpty {
            let result = PHAsset.fetchAssets(withLocalIdentifiers: identifiers, options: nil)
            result.enumerateObjects { asset, _, _ in assetsByIdentifier[asset.localIdentifier] = asset }
        }

        var resolved: [(row: ProtectedRow, asset: PHAsset)] = []
        resolved.reserveCapacity(min(rows.count, assetsByIdentifier.count))
        for (index, row) in rows.enumerated() {
            if let identifier = row.iosLocalIdentifier, let asset = assetsByIdentifier[identifier] {
                resolved.append((row, asset))
            }
            // Keep the UI responsive while reconciling a large cloud library.
            if index % 250 == 0 { await Task.yield() }
        }
        return resolved
    }
'''
          s=s[:start]+new+s[end:]
          old='''            let rows = try await protectedRows(); var resolved: [(row: ProtectedRow, asset: PHAsset)] = []
            for row in rows { guard let asset = localAsset(for: row) else { continue }; resolved.append((row, asset)); if row.iosLocalIdentifier != asset.localIdentifier { try? await SupabaseService.updateLocalIdentifier(assetID: row.id, localIdentifier: asset.localIdentifier) } }
'''
          replacement='''            let rows = try await protectedRows()
            let resolved = await resolveLocalAssets(for: rows)
'''
          if old not in s: raise SystemExit('prepare anchor not found; refusing partial patch')
          s=s.replace(old,replacement,1)
          old2='''            let rows = try await protectedRows(); var selected: [(row: ProtectedRow, asset: PHAsset)] = []
            for row in rows {
                guard let asset = localAsset(for: row), wanted.contains(asset.localIdentifier) else { continue }
                selected.append((row, asset))
                if row.iosLocalIdentifier != asset.localIdentifier { try? await SupabaseService.updateLocalIdentifier(assetID: row.id, localIdentifier: asset.localIdentifier) }
            }
'''
          replacement2='''            let rows = try await protectedRows()
            let resolved = await resolveLocalAssets(for: rows)
            let selected = resolved.filter { wanted.contains($0.asset.localIdentifier) }
'''
          if old2 not in s: raise SystemExit('prepareExact anchor not found; refusing partial patch')
          s=s.replace(old2,replacement2,1)
          p.write_text(s)
      - name: Validate and commit
        run: |
          git diff --check
          test "$(git diff --name-only)" = "Liberons/ProtectedSpaceCleaner.swift"
          grep -q 'resolveLocalAssets' Liberons/ProtectedSpaceCleaner.swift
          grep -q 'fetchAssets(withLocalIdentifiers: identifiers' Liberons/ProtectedSpaceCleaner.swift
          ! grep -q 'private func localAsset(for row:' Liberons/ProtectedSpaceCleaner.swift
          grep -q 'let pageSize = 500' Liberons/ProtectedSpaceCleaner.swift
          grep -q 'deletePreparedFromIPhone' Liberons/ProtectedSpaceCleaner.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Liberons/ProtectedSpaceCleaner.swift
          git commit -m "Resolve protected iPhone media in bulk"
          git push origin HEAD:library-protected-media
