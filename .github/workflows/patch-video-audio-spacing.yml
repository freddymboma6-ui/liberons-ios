name: Patch protected video audio spacing
'on':
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/patch-video-audio-spacing.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Apply focused patch
        run: python3 .github/scripts/patch_video_audio_spacing.py
      - name: Validate patch
        run: |
          grep -q "isVideoMuted" Liberons/ProtectedLibraryView.swift
          grep -q 'padding(.top, 86)' Liberons/ProtectedLibraryView.swift
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Liberons/ProtectedLibraryView.swift
          git commit -m "Separate protected video audio control"
          git push origin HEAD:library-protected-media
