name: Wire million-scale protected library paging
on:
  push:
    paths:
      - '.github/workflows/scale-million-library.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Connect Library UI to cursor-paged store
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Liberons/ProtectedLibraryView.swift')
          s=p.read_text()
          old='Text("\\(filterCounts[.all, default: store.items.count].formatted()) \\(language.text("protected memories", "souvenirs protégés"))")'
          new='Text("\\(Int(store.totalCount).formatted()) \\(language.text("protected memories", "souvenirs protégés"))")'
          assert old in s, 'count label anchor missing'
          s=s.replace(old,new,1)
          old='ProtectedLibraryTile(item: item).matchedTransitionSource(id: item.id, in: photoTransition)'
          new='ProtectedLibraryTile(item: item).matchedTransitionSource(id: item.id, in: photoTransition)\n                                            .task {\n                                                let before = store.items.count\n                                                await store.loadMoreIfNeeded(currentItem: item)\n                                                if store.items.count != before { rebuildDisplayItems() }\n                                            }'
          assert old in s, 'tile anchor missing'
          s=s.replace(old,new,1)
          old='    @MainActor private func selectFilter(_ filter: ProtectedLibraryFilter) {\n        guard mediaFilter != filter else { return }\n        withAnimation(.snappy(duration: 0.24)) { mediaFilter = filter }\n        rebuildDisplayItems()\n        if isSelecting { selectedIDs.formIntersection(Set(displayItems.map(\\.id))) }\n    }\n\n    @MainActor private func setSort(newestFirst: Bool) {\n        guard sortNewestFirst != newestFirst else { return }\n        sortNewestFirst = newestFirst\n        rebuildDisplayItems()\n    }\n'
          new='    @MainActor private func selectFilter(_ filter: ProtectedLibraryFilter) {\n        guard mediaFilter != filter else { return }\n        withAnimation(.snappy(duration: 0.24)) { mediaFilter = filter }\n        selectedIDs.removeAll()\n        Task {\n            await store.refresh(filter: filter.rawValue, newestFirst: sortNewestFirst)\n            rebuildDisplayItems()\n        }\n    }\n\n    @MainActor private func setSort(newestFirst: Bool) {\n        guard sortNewestFirst != newestFirst else { return }\n        sortNewestFirst = newestFirst\n        selectedIDs.removeAll()\n        Task {\n            await store.refresh(filter: mediaFilter.rawValue, newestFirst: newestFirst)\n            rebuildDisplayItems()\n        }\n    }\n'
          assert old in s, 'filter/sort anchor missing'
          s=s.replace(old,new,1)
          old='        filterCounts = [.all: all, .photos: photos, .videos: videos]\n        displayItems = visible\n'
          new='        filterCounts = [.all: Int(store.totalCount), .photos: Int(store.photoCount), .videos: Int(store.videoCount)]\n        displayItems = visible\n'
          assert old in s, 'counts anchor missing'
          s=s.replace(old,new,1)
          old='        async let a: Void = store.refresh()\n        async let b: Void = billing.refresh()\n'
          new='        async let a: Void = store.refresh(filter: mediaFilter.rawValue, newestFirst: sortNewestFirst)\n        async let b: Void = billing.refresh()\n'
          assert old in s, 'refresh anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/ProtectedLibraryView.swift
          git diff --cached --quiet && exit 0
          git commit -m "Connect Library UI to cursor pagination"
          git push origin HEAD:library-protected-media
