name: Compact premium memory sheet v2
on:
  push:
    paths:
      - '.github/workflows/compact-memory-sheet-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Make memory info sheet compact and expandable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Liberons/ProtectedLibraryView.swift')
          s=p.read_text()
          old='.presentationDetents([.fraction(0.72),.large]).presentationDragIndicator(.visible).presentationCornerRadius(34).presentationBackground(.regularMaterial).presentationContentInteraction(.scrolls).presentationBackgroundInteraction(.enabled(upThrough:.fraction(0.72)))'
          new='.presentationDetents([.fraction(0.46),.fraction(0.72),.large]).presentationDragIndicator(.visible).presentationCornerRadius(34).presentationBackground(.regularMaterial).presentationContentInteraction(.resizes).presentationBackgroundInteraction(.enabled(upThrough:.fraction(0.46)))'
          if old not in s:
              raise SystemExit('memory sheet presentation anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          grep -q 'fraction(0.46)' Liberons/ProtectedLibraryView.swift
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Make memory details compact and expandable'
          git push origin HEAD:library-protected-media
