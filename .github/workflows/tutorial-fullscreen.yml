name: Add tutorial fullscreen support

on:
  push:
    branches:
      - library-protected-media

permissions:
  contents: write

jobs:
  update-tutorial:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Add fullscreen tutorial player
        shell: python
        run: |
          from pathlib import Path
          path = Path('Liberons/AppSettingsView.swift')
          text = path.read_text()
          old_state = '    @State private var player: AVPlayer?\n'
          new_state = '    @State private var player: AVPlayer?\n    @State private var showingFullscreen = false\n'
          old_player = '                    if let player { VideoPlayer(player: player).aspectRatio(16/9, contentMode: .fit) }\n'
          new_player = '''                    if let player {\n                        ZStack(alignment: .topTrailing) {\n                            VideoPlayer(player: player).aspectRatio(16/9, contentMode: .fit)\n                            Button { showingFullscreen = true } label: {\n                                Image(systemName: "arrow.up.left.and.arrow.down.right")\n                                    .font(.system(size: 16, weight: .bold))\n                                    .foregroundStyle(.white)\n                                    .frame(width: 44, height: 44)\n                                    .background(.black.opacity(0.68), in: Circle())\n                            }\n                            .buttonStyle(.plain)\n                            .padding(10)\n                            .accessibilityLabel(language.text("Full screen", "Plein écran"))\n                        }\n                    }\n'''
          old_change = '        .onChange(of: language.language) { _, _ in player?.pause(); player = AVPlayer(url: tutorialURL) }\n'
          new_change = '''        .onChange(of: language.language) { _, _ in player?.pause(); player = AVPlayer(url: tutorialURL) }\n        .fullScreenCover(isPresented: $showingFullscreen) {\n            if let player {\n                ZStack {\n                    Color.black.ignoresSafeArea()\n                    VideoPlayer(player: player).ignoresSafeArea()\n                    VStack {\n                        HStack {\n                            Spacer()\n                            Button { showingFullscreen = false } label: {\n                                Image(systemName: "xmark")\n                                    .font(.system(size: 17, weight: .bold))\n                                    .foregroundStyle(.white)\n                                    .frame(width: 44, height: 44)\n                                    .background(.black.opacity(0.65), in: Circle())\n                            }\n                            .padding()\n                            .accessibilityLabel(language.text("Close full screen", "Fermer le plein écran"))\n                        }\n                        Spacer()\n                    }\n                }\n                .statusBarHidden(true)\n            }\n        }\n'''
          if 'showingFullscreen' not in text:
              if old_state not in text or old_player not in text or old_change not in text:
                  raise SystemExit('Expected tutorial player structure not found')
              text = text.replace(old_state, new_state, 1)
              text = text.replace(old_player, new_player, 1)
              text = text.replace(old_change, new_change, 1)
              path.write_text(text)
          else:
              print('Fullscreen support already present')
      - name: Commit change and remove temporary workflow
        run: |
          rm -f .github/workflows/tutorial-fullscreen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/AppSettingsView.swift .github/workflows/tutorial-fullscreen.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add fullscreen mode to iOS tutorial player"
          git push origin HEAD:library-protected-media
