name: Fix account settings closure
on:
  push:
    branches: [library-protected-media]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Fix nested shorthand closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Liberons/AccountSettingsViews.swift')
          s = p.read_text()
          old = 'ForEach(categories.filter { $0.0 != "all" && filteredItems.contains(where: { item in item.category == $0.0 }) }, id: \\.0) { category in'
          new = 'ForEach(categories.filter { category in category.0 != "all" && filteredItems.contains(where: { item in item.category == category.0 }) }, id: \\.0) { category in'
          if old not in s:
              raise SystemExit('Expected problematic closure not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/AccountSettingsViews.swift
          git commit -m "Fix nested FAQ category closure"
          git push
