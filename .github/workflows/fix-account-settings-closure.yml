name: Apply library polish
'on':
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/fix-account-settings-closure.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Apply patch
        run: python3 .github/scripts/patch_library_polish.py
      - name: Validate
        run: |
          grep -q "Loading protected memories" Liberons/ProtectedLibraryView.swift
          grep -q "infoDetent: PresentationDetent = .fraction(0.64)" Liberons/ProtectedLibraryView.swift
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Liberons/ProtectedLibraryView.swift
          git commit -m "Polish library loading and info sheet height"
          git push origin HEAD:library-protected-media
