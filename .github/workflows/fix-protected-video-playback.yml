name: Video repair
on: [push]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Repair malformed Swift path
        run: |
          echo '' | base64 --decode > /tmp/repair.py
          python3 /tmp/repair.py
          grep -Fq 'URL(fileURLWithPath:$0)' Liberons/ProtectedLibraryView.swift
          ! grep -Fq '/home/runner/' Liberons/ProtectedLibraryView.swift
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Repair protected video playback Swift code'
          git push origin HEAD:library-protected-media
