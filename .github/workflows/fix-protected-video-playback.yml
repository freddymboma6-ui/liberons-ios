name: Protected video stream-purpose repair
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Separate playback from restore delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Liberons/SupabaseService.swift')
          s=p.read_text()
          old='''static func cloudMediaURL(assetID: UUID, variant:String="original") async throws -> URL {
        let body = try JSONSerialization.data(withJSONObject: ["asset_id": assetID.uuidString,"variant":variant])'''
          new='''static func cloudMediaURL(assetID: UUID, variant:String="original", purpose:String="restore") async throws -> URL {
        let body = try JSONSerialization.data(withJSONObject: ["asset_id": assetID.uuidString,"variant":variant,"purpose":purpose])'''
          if old not in s: raise SystemExit('cloudMediaURL anchor not found')
          s=s.replace(old,new,1)
          old='''static func cloudOriginalURL(assetID:UUID) async throws -> URL { try await cloudMediaURL(assetID:assetID,variant:"original") }'''
          new='''static func cloudOriginalURL(assetID:UUID) async throws -> URL { try await cloudMediaURL(assetID:assetID,variant:"original",purpose:"restore") }
    static func cloudStreamURL(assetID:UUID) async throws -> URL { try await cloudMediaURL(assetID:assetID,variant:"original",purpose:"stream") }'''
          if old not in s: raise SystemExit('cloudOriginalURL anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('Liberons/ProtectedLibraryView.swift')
          s=p.read_text()
          old='''let remote=try await SupabaseService.cloudOriginalURL(assetID:item.id);let asset=AVURLAsset(url:remote,options:["AVURLAssetHTTPHeaderFieldsKey":["Accept":"video/*","Range":"bytes=0-"]])'''
          new='''let remote=try await SupabaseService.cloudStreamURL(assetID:item.id);let asset=AVURLAsset(url:remote)'''
          if old not in s: raise SystemExit('video stream anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'cloudStreamURL' Liberons/SupabaseService.swift
          grep -q 'purpose:String="restore"' Liberons/SupabaseService.swift
          grep -q 'SupabaseService.cloudStreamURL' Liberons/ProtectedLibraryView.swift
          if grep -q 'AVURLAssetHTTPHeaderFieldsKey' Liberons/ProtectedLibraryView.swift; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/SupabaseService.swift Liberons/ProtectedLibraryView.swift
          git commit -m 'Separate protected video streaming from restore'
          git push origin HEAD:library-protected-media
