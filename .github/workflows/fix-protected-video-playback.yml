name: Protected video local playback repair
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Apply reliable video repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Liberons/ProtectedLibraryView.swift')
          s=p.read_text()
          old='''if isVideo{guard !billing.isPaymentRestricted else{return};do{let remote=try await SupabaseService.cloudOriginalURL(assetID:item.id);let avPlayer=AVPlayer(url:remote);player=avPlayer;avPlayer.play()}catch{loadFailed=true};return}'''
          new='''if isVideo{guard !billing.isPaymentRestricted else{return};do{let ext=item.originalFilename.flatMap{let e=URL(fileURLWithPath:$0).pathExtension;return e.isEmpty ? nil:e} ?? "mov";let dir=FileManager.default.urls(for:.cachesDirectory,in:.userDomainMask)[0].appendingPathComponent("LiberonsRecovery",isDirectory:true);try FileManager.default.createDirectory(at:dir,withIntermediateDirectories:true);let local=dir.appendingPathComponent("\\(item.id.uuidString).\\(ext)");if !FileManager.default.fileExists(atPath:local.path){let remote=try await SupabaseService.cloudOriginalURL(assetID:item.id);let(downloaded,response)=try await URLSession.shared.download(from:remote);guard let http=response as? HTTPURLResponse,(200..<300).contains(http.statusCode) else{throw URLError(.badServerResponse)};try? FileManager.default.removeItem(at:local);try FileManager.default.moveItem(at:downloaded,to:local)};let asset=AVURLAsset(url:local);guard try await asset.load(.isPlayable) else{try? FileManager.default.removeItem(at:local);throw URLError(.cannotDecodeContentData)};let item=AVPlayerItem(asset:asset);let avPlayer=AVPlayer(playerItem:item);player=avPlayer;avPlayer.play()}catch{loadFailed=true};return}'''
          if old not in s: raise SystemExit('video playback anchor not found')
          s=s.replace(old,new,1)
          oldmeta='''MetadataRow(icon:"calendar",title:language.text("Photo taken","Photo prise le"),value:format(item.capturedAt))'''
          newmeta='''MetadataRow(icon:"calendar",title:isVideo ? language.text("Video taken","Vidéo prise le"):language.text("Photo taken","Photo prise le"),value:format(item.capturedAt))'''
          if oldmeta not in s: raise SystemExit('metadata anchor not found')
          s=s.replace(oldmeta,newmeta,1)
          oldremove='''case .removeDevice:language.text("This photo will be removed from Photos on this iPhone to free local space.","Cette photo sera supprimée de Photos sur cet iPhone afin de libérer de l’espace local.")'''
          newremove='''case .removeDevice:language.text(isVideo ? "This video will be removed from Photos on this iPhone to free local space.":"This photo will be removed from Photos on this iPhone to free local space.",isVideo ? "Cette vidéo sera supprimée de Photos sur cet iPhone afin de libérer de l’espace local.":"Cette photo sera supprimée de Photos sur cet iPhone afin de libérer de l’espace local.")'''
          if oldremove in s:s=s.replace(oldremove,newremove,1)
          tile='''@MainActor private func loadThumbnail()async{if let id=item.iosLocalIdentifier'''
          tile_new='''@MainActor private func loadThumbnail()async{if let cached=ProtectedMediaCache.shared.image(for:item.id){image=cached;return};if let id=item.iosLocalIdentifier'''
          if tile not in s: raise SystemExit('thumbnail anchor not found')
          s=s.replace(tile,tile_new,1)
          localthumb='''if let value{Task{@MainActor in image=value}}'''
          localthumb_new='''if let value{ProtectedMediaCache.shared.store(value,for:self.item.id);Task{@MainActor in image=value}}'''
          if localthumb in s:s=s.replace(localthumb,localthumb_new,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'AVURLAsset(url:local)' Liberons/ProtectedLibraryView.swift
          grep -q 'Video taken' Liberons/ProtectedLibraryView.swift
          grep -q 'loadThumbnail()async{if let cached=ProtectedMediaCache' Liberons/ProtectedLibraryView.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Fix protected video playback and video metadata'
          git push origin HEAD:library-protected-media
