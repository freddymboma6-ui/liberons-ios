name: Protected video B2 range diagnostics
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Add range diagnostics to protected video playback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Liberons/ProtectedLibraryView.swift')
          s=p.read_text()
          old='''if isVideo{guard !billing.isPaymentRestricted else{return};do{let remote=try await SupabaseService.cloudStreamURL(assetID:item.id);let asset=AVURLAsset(url:remote);let playable=try await asset.load(.isPlayable);guard playable else{throw URLError(.cannotDecodeContentData)};let playerItem=AVPlayerItem(asset:asset);playerItem.preferredForwardBufferDuration=3;playerItem.canUseNetworkResourcesForLiveStreamingWhilePaused=true;let avPlayer=AVPlayer(playerItem:playerItem);avPlayer.automaticallyWaitsToMinimizeStalling=true;player=avPlayer;avPlayer.play()}catch{loadFailed=true};return}'''
          new='''if isVideo{guard !billing.isPaymentRestricted else{return};do{let remote=try await SupabaseService.cloudStreamURL(assetID:item.id);await diagnoseVideoRange(remote);let asset=AVURLAsset(url:remote);let playable=try await asset.load(.isPlayable);guard playable else{throw URLError(.cannotDecodeContentData)};let playerItem=AVPlayerItem(asset:asset);playerItem.preferredForwardBufferDuration=3;playerItem.canUseNetworkResourcesForLiveStreamingWhilePaused=true;let avPlayer=AVPlayer(playerItem:playerItem);avPlayer.automaticallyWaitsToMinimizeStalling=true;player=avPlayer;avPlayer.play()}catch{print("[LiberonsVideo] playback error asset=\\(item.id) error=\\(error)");loadFailed=true};return}'''
          if old not in s: raise SystemExit('video playback anchor not found')
          s=s.replace(old,new,1)
          anchor='''    }
}

private final class ProtectedMediaCache'''
          helper='''    }
    private func diagnoseVideoRange(_ url:URL) async {
        var request=URLRequest(url:url)
        request.httpMethod="GET"
        request.setValue("bytes=0-1023",forHTTPHeaderField:"Range")
        request.timeoutInterval=20
        do{
            let(data,response)=try await URLSession.shared.data(for:request)
            guard let http=response as? HTTPURLResponse else{print("[LiberonsVideo] range probe: non-HTTP response");return}
            let prefix=String(data:data.prefix(64),encoding:.isoLatin1)?.map{$0.isASCII && !$0.isNewline ? $0 : "."}.reduce(""){$0+String($1)} ?? ""
            print("[LiberonsVideo] range probe asset=\\(item.id) status=\\(http.statusCode) bytes=\\(data.count) contentType=\\(http.value(forHTTPHeaderField:\"Content-Type\") ?? \"nil\") contentLength=\\(http.value(forHTTPHeaderField:\"Content-Length\") ?? \"nil\") acceptRanges=\\(http.value(forHTTPHeaderField:\"Accept-Ranges\") ?? \"nil\") contentRange=\\(http.value(forHTTPHeaderField:\"Content-Range\") ?? \"nil\") prefix=\\(prefix)")
        }catch{print("[LiberonsVideo] range probe failed asset=\\(item.id) error=\\(error)")}
    }
}

private final class ProtectedMediaCache'''
          if anchor not in s: raise SystemExit('helper anchor not found')
          s=s.replace(anchor,helper,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'diagnoseVideoRange' Liberons/ProtectedLibraryView.swift
          grep -q 'bytes=0-1023' Liberons/ProtectedLibraryView.swift
          grep -q '\[LiberonsVideo\] range probe' Liberons/ProtectedLibraryView.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Add protected video range diagnostics'
          git push origin HEAD:library-protected-media
