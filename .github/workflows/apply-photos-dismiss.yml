name: Apply Photos-style media dismissal
on:
  workflow_dispatch:
  push:
    branches: [library-protected-media]
    paths: ['.github/workflows/apply-photos-dismiss.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Patch viewer
        run: echo '' | base64 -d | python3
      - name: Commit
        run: |
          git config user.name "freddymboma6-ui"
          git config user.email "freddymboma6@gmail.com"
          git add Liberons/ProtectedLibraryView.swift
          git diff --cached --quiet && exit 0
          git commit -m "Match Photos interactive media dismissal"
          git push origin HEAD:library-protected-media
