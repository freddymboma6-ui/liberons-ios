name: Apply direct protected video player fix
on:
  push:
    branches:
      - library-protected-media
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Patch Swift player
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()
          old = 'if isVideo{guard !billing.isPaymentRestricted else{return};do{let remote=try await SupabaseService.cloudStreamURL(assetID:item.id);await liberonsProbeVideoRange(remote,assetID:item.id);let asset=AVURLAsset(url:remote);let playable=try await asset.load(.isPlayable);guard playable else{throw URLError(.cannotDecodeContentData)};let playerItem=AVPlayerItem(asset:asset);playerItem.preferredForwardBufferDuration=3;playerItem.canUseNetworkResourcesForLiveStreamingWhilePaused=true;let avPlayer=AVPlayer(playerItem:playerItem);avPlayer.automaticallyWaitsToMinimizeStalling=true;player=avPlayer;avPlayer.play()}catch{loadFailed=true};return}'
          new = 'if isVideo{guard !billing.isPaymentRestricted else{return};do{let remote=try await SupabaseService.cloudStreamURL(assetID:item.id);let playerItem=AVPlayerItem(url:remote);playerItem.preferredForwardBufferDuration=3;playerItem.canUseNetworkResourcesForLiveStreamingWhilePaused=true;let avPlayer=AVPlayer(playerItem:playerItem);avPlayer.automaticallyWaitsToMinimizeStalling=true;player=avPlayer;avPlayer.play()}catch{loadFailed=true};return}'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('current video block not found')
          s = s.replace(old,new,1)
          marker = '\n\nprivate func liberonsProbeVideoRange(_ url:URL,assetID:UUID) async {'
          if marker in s:
              start = s.index(marker)
              s = s[:start].rstrip() + '\n'
          p.write_text(s)
          PY
      - name: Commit Swift fix
        shell: bash
        run: |
          grep -q 'AVPlayerItem(url:remote)' Liberons/ProtectedLibraryView.swift
          if grep -q 'asset.load(.isPlayable)' Liberons/ProtectedLibraryView.swift; then echo 'isPlayable preflight still present' && exit 1; fi
          if grep -q 'liberonsProbeVideoRange' Liberons/ProtectedLibraryView.swift; then echo 'diagnostic probe still present' && exit 1; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Play protected videos without AVAsset preflight'
          git push origin HEAD:library-protected-media
