name: Premium viewer dismissal patch

on:
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/patch-premium-viewer-dismiss.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - name: Patch protected gallery dismissal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()
          old_state = '@Environment(\\.dismiss) private var dismiss; @State private var selection:UUID; @State private var showInfo=false; @State private var verticalOffset:CGFloat=0'
          new_state = '@Environment(\\.dismiss) private var dismiss; @State private var selection:UUID; @State private var showInfo=false; @State private var verticalOffset:CGFloat=0; @State private var isDismissing=false'
          if old_state not in s:
              raise SystemExit('viewer state anchor not found')
          s = s.replace(old_state, new_state, 1)
          old_gesture = '.simultaneousGesture(DragGesture(minimumDistance:10).onChanged{v in guard v.translation.height>0,abs(v.translation.height)>abs(v.translation.width) else{return};verticalOffset=v.translation.height}.onEnded{v in guard v.translation.height>0,abs(v.translation.height)>abs(v.translation.width) else{withAnimation(.snappy){verticalOffset=0};return};if verticalOffset>110 || v.predictedEndTranslation.height>220{dismiss()}else{withAnimation(.snappy){verticalOffset=0}}})'
          new_gesture = '''.simultaneousGesture(DragGesture(minimumDistance:14,coordinateSpace:.global).onChanged{v in
            guard !isDismissing else{return}
            let y=v.translation.height
            guard y>0,abs(y)>abs(v.translation.width)*1.15 else{return}
            verticalOffset=y
          }.onEnded{v in
            guard !isDismissing else{return}
            let y=max(verticalOffset,v.translation.height)
            let predicted=max(y,v.predictedEndTranslation.height)
            guard y>0,abs(v.translation.height)>abs(v.translation.width)*1.05 else{withAnimation(.spring(response:0.30,dampingFraction:0.88)){verticalOffset=0};return}
            if y>92 || predicted>185{
              isDismissing=true
              withAnimation(.easeOut(duration:0.18)){verticalOffset=max(y,UIScreen.main.bounds.height*0.22)}
              Task{@MainActor in try? await Task.sleep(for:.milliseconds(120));dismiss()}
            }else{
              withAnimation(.spring(response:0.30,dampingFraction:0.88)){verticalOffset=0}
            }
          })'''
          if old_gesture not in s:
              raise SystemExit('viewer gesture anchor not found')
          s = s.replace(old_gesture, new_gesture, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Polish protected viewer swipe dismissal'
          git push origin HEAD:library-protected-media
