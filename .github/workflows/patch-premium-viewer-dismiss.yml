name: Protected gallery continuity patch

on:
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/patch-premium-viewer-dismiss.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Patch protected gallery continuity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view = Path('Liberons/ProtectedLibraryView.swift')
          s = view.read_text()

          # Closing the viewer must NEVER refetch/rebuild the grid. That rebuild was
          # invalidating SwiftUI's scroll position and sending the user back upward.
          old = '.onDisappear { ProtectedMediaCache.shared.clearFullResolution(); Task { await refreshLibrary() } }'
          new = '.onDisappear { ProtectedMediaCache.shared.clearFullResolution() }'
          if old not in s:
              raise SystemExit('viewer refresh anchor not found')
          s = s.replace(old, new, 1)

          # PhotoKit thumbnails should paint a fast/degraded frame immediately and
          # refine afterwards, instead of holding an empty placeholder for HQ/exact.
          old = 'options.deliveryMode = .highQualityFormat;options.resizeMode = .exact;PHImageManager.default().requestImage(for:asset,targetSize:CGSize(width:600,height:600),contentMode:.aspectFill'
          new = 'options.deliveryMode = .opportunistic;options.resizeMode = .fast;PHImageManager.default().requestImage(for:asset,targetSize:CGSize(width:360,height:360),contentMode:.aspectFill'
          if old not in s:
              raise SystemExit('thumbnail PhotoKit anchor not found')
          s = s.replace(old, new, 1)

          # Keep more already-decoded grid thumbnails warm while browsing back/forth.
          old = 'thumbnailCache.countLimit=120;thumbnailCache.totalCostLimit=48*1024*1024'
          new = 'thumbnailCache.countLimit=360;thumbnailCache.totalCostLimit=72*1024*1024'
          if old not in s:
              raise SystemExit('thumbnail cache anchor not found')
          s = s.replace(old, new, 1)
          view.write_text(s)

          store = Path('Liberons/ProtectedMediaStore.swift')
          t = store.read_text()
          if 'private let pageSize = 24' not in t:
              raise SystemExit('page size anchor not found')
          t = t.replace('private let pageSize = 24', 'private let pageSize = 120', 1)
          t = t.replace('let threshold = max(items.count - 8, 0)', 'let threshold = max(items.count - 30, 0)', 1)
          t = t.replace('// decoding work in the grid/viewer, so 24 gives us a much safer ceiling while\n    // cursor pagination keeps the complete cloud library accessible.', '// Grid cells are lazy, so keeping a larger metadata page avoids constant network\n    // pagination while scrolling without decoding every asset into memory.', 1)
          store.write_text(t)
          PY
      - name: Commit continuity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift Liberons/ProtectedMediaStore.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Keep protected gallery position and load thumbnails faster'
          git push origin HEAD:library-protected-media
