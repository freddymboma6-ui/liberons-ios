name: Premium protected gallery polish

on:
  push:
    branches: [library-protected-media]
    paths: [.github/workflows/patch-premium-viewer-dismiss.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Apply focused gallery patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_gallery.py
          python3 /tmp/patch_gallery.py
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git diff --cached --quiet && exit 0
          git commit -m 'Fix protected thumbnails and native photo zoom'
          git push origin HEAD:library-protected-media
