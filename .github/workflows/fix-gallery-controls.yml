name: Fix gallery controls
on:
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/fix-gallery-controls.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - run: python3 .github/scripts/move_gallery_info_button.py
      - run: git diff --check
      - run: |
          ! grep -q 'VideoPlayer(player:' Liberons/ProtectedLibraryView.swift
          grep -q 'ProtectedVideoSurface(player: player)' Liberons/ProtectedLibraryView.swift
      - run: git config user.name gallery-fix
      - run: git config user.email gallery-fix@users.noreply.github.com
      - run: git add Liberons/ProtectedLibraryView.swift
      - run: git commit -m "Remove native volume control from protected video viewer"
      - run: git push origin HEAD:library-protected-media
