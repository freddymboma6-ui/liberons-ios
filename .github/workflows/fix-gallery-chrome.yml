name: Fix gallery chrome
on:
  push:
    branches: [library-protected-media]
    paths:
      - '.github/workflows/fix-gallery-chrome.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
      - run: python3 .github/scripts/fix_gallery_chrome.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Hide video controls on tap and restore info to right'
          git push origin HEAD:library-protected-media
