name: Fix protected photo viewer

on:
  push:
    branches:
      - library-protected-media
    paths:
      - .github/workflows/fix-protected-photo-viewer-now.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - run: python3 .github/scripts/fix_protected_photo_viewer_now.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liberons/ProtectedLibraryView.swift
          git diff --cached --quiet && exit 0
          git commit -m "Fix protected photo viewer native layout and zoom"
          git push origin HEAD:library-protected-media
