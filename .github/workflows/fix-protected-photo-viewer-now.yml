name: Fix protected photo viewer now
on:
  push:
    branches: [library-protected-media]
    paths:
      - '.github/workflows/fix-protected-photo-viewer-now.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library-protected-media
          fetch-depth: 0
      - name: Replace broken UIKit photo surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Liberons/ProtectedLibraryView.swift')
          s = p.read_text()
          pattern = r'private struct ProtectedZoomablePhoto:UIViewRepresentable\{.*?\}\nprivate enum ProtectedMediaPrefetcher'
          replacement = '''private struct ProtectedZoomablePhoto: View {
              let image: UIImage
              var body: some View {
                  GeometryReader { proxy in
                      Image(uiImage: image)
                          .resizable()
                          .scaledToFit()
                          .frame(width: proxy.size.width, height: proxy.size.height)
                          .contentShape(Rectangle())
                  }
                  .ignoresSafeArea()
              }
          }
          private enum ProtectedMediaPrefetcher'''
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one ProtectedZoomablePhoto block, replaced {count}')
          p.write_text(updated)
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Liberons/ProtectedLibraryView.swift
          git commit -m 'Fix protected photo viewer rendering'
          git push origin HEAD:library-protected-media
